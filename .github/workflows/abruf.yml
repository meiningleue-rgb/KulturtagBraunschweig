name: Termine abrufen

on:
  schedule:
    # sonntags und donnerstags 10:43 deutscher Zeit (Winterzeit; im Sommer 11:43)
    # donnerstags, weil die Kinos ihre neue Woche erst dann veröffentlichen
    - cron: "43 9 * * 0,4"
  workflow_dispatch: # „Run workflow“ auf GitHub oder in der GitHub-App
  push: # nach Änderungen an Werkzeugen oder Ablauf sofort neu bauen
    branches: [main]
    paths: ["tools/**", ".github/workflows/**"]

permissions:
  contents: write # nur für das monatliche Lebenszeichen
  pages: write
  id-token: write

concurrency:
  group: abruf
  cancel-in-progress: false

jobs:
  abruf:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Rohdaten bleiben NICHT im (öffentlichen) Repository, sondern im Zwischenspeicher von GitHub Actions.
      # Fällt eine Quelle aus, wird ihr Stand vom letzten Lauf von hier genommen.
      - name: Rohdaten vom letzten Lauf holen
        uses: actions/cache@v4
        with:
          path: daten/roh
          key: roh-${{ github.run_id }}
          restore-keys: roh-

      - name: Browser installieren
        run: |
          sudo apt-get install -y poppler-utils
          pip install playwright
          python -m playwright install --with-deps chromium

      - name: Quellen abrufen und Seite bauen
        env:
          TZ: Europe/Berlin
          GOATCOUNTER: ${{ vars.GOATCOUNTER }} # Besucherzähler, als Repository-Variable gesetzt
        run: python tools/kulturtag.py --github . --tage 21

      # Die Seite wird mit dem Passwort aus dem Repository-Geheimnis KULTURTAG_PASSWORT verschlüsselt (StatiCrypt).
      # Ohne Geheimnis wird nur ein Hinweis veröffentlicht – nie die Termine im Klartext.
      - name: Seite verschlüsseln
        env:
          PASSWORT: ${{ secrets.KULTURTAG_PASSWORT }}
        run: |
          mkdir -p _site
          cp apple-touch-icon.png _site/
          if [ -z "$PASSWORT" ]; then
            echo "::warning::Geheimnis KULTURTAG_PASSWORT fehlt – es wird nur ein Hinweis veröffentlicht."
            printf '%s' '<!doctype html><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1"><meta name=robots content=noindex><title>Kulturtag Braunschweig</title><p style="font:18px system-ui;margin:3em 1em;text-align:center">Kulturtag Braunschweig wird gerade eingerichtet.</p>' > _site/index.html
            exit 0
          fi
          npx -y staticrypt@3 index.html -p "$PASSWORT" -d _site -c false --short --remember 90 \
            -s 3e72b91c3e60ea8a987ddcf2a3f0b748 \
            --template-title "Kulturtag Braunschweig" \
            --template-instructions "Bitte Passwort eingeben." \
            --template-button "Öffnen" \
            --template-placeholder "Passwort" \
            --template-remember "Auf diesem Gerät merken" \
            --template-error "Passwort stimmt nicht." \
            --template-toggle-show "Passwort zeigen" \
            --template-toggle-hide "Passwort verbergen" \
            --template-color-primary "#a3241c" \
            --template-color-secondary "#f7f6f4"
          # Anmeldeseite: nicht in Suchmaschinen, Symbol für den Home-Bildschirm
          # „Auf diesem Gerät merken“ standardmäßig angehakt
          sed -i 's#<input id="staticrypt-remember" type="checkbox" name="remember" />#<input id="staticrypt-remember" type="checkbox" name="remember" checked />#' _site/index.html
          sed -i 's#<head>#<head><meta name="robots" content="noindex,nofollow"><link rel="apple-touch-icon" href="apple-touch-icon.png"><meta name="apple-mobile-web-app-title" content="Kulturtag">#' _site/index.html

      # GitHub schaltet geplante Läufe ab, wenn ein öffentliches Repository 60 Tage ohne Aktivität ist.
      # Deshalb einmal im Monat ein Zeitstempel (nur Datum, keine Termine).
      - name: Monatliches Lebenszeichen
        run: |
          letzt=$(grep -oE '[0-9]{4}-[0-9]{2}-[0-9]{2}' lebenszeichen.txt 2>/dev/null | head -1)
          alter=$(( ( $(date +%s) - $(date -d "${letzt:-2000-01-01}" +%s) ) / 86400 ))
          if [ "$alter" -ge 25 ]; then
            echo "Letztes Lebenszeichen: $(TZ=Europe/Berlin date '+%Y-%m-%d') – sorgt dafür, dass GitHub den Zeitplan nicht abschaltet." > lebenszeichen.txt
            git config user.name "kulturtag-bot"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add lebenszeichen.txt
            git commit -m "Lebenszeichen $(TZ=Europe/Berlin date '+%d.%m.%Y')"
            git push
          else
            echo "Lebenszeichen ist $alter Tage alt – nichts zu tun."
          fi

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  veroeffentlichen:
    needs: abruf
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
